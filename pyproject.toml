[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "github-repo-push"
version = "0.1.0"
description = "Unified repository dashboard and push manager for Panbear1983 GitHub account"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "textual>=0.52",
    "gitpython>=3.1",
    "jinja2>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
ghrp = "github_repo_push.cli:main"
ghrp-dashboard = "github_repo_push.dashboard.app:main"

[tool.setuptools.packages.find]
include = ["github_repo_push*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "C4", "PT", "TRY"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true